<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusNet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="view/css/style.css" rel="stylesheet">
</head>
<body>


<!-- ======================== TOPBAR ======================== -->
<div class="topbar d-flex align-items-center dark-background">
    <div class="container d-flex justify-content-center justify-content-md-between">
        <div class="contact-info d-flex align-items-center">
            <i class="bi bi-people-fill me-2"></i>
            <a href="mailto:contact@example.com">Bienvenidos Institución Educativa CampusNet</a>
            <i class="bi bi-phone ms-4 me-2"></i>
            <span>CampusNet.co</span>
        </div>
        <div class="social-links d-none d-md-flex align-items-center">
            <a href="#"><i class="bi bi-twitter-x"></i></a>
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-linkedin"></i></a>
        </div>
    </div>
</div>

<!-- ======================== CONTENIDO PRINCIPAL ======================== -->
<div class="container mt-5">

    <!-- Título -->
    <h2 class="mb-4">Institución educativa CampusNet</h2>

    <!-- Botones principales -->
    <div class="mb-3">
        <button type="button" class="btn btn-primary me-2" onclick="MostrarFormulario();">
            Agregar Estudiante
        </button>
    </div>

    <!-- ======================== FORMULARIO (div oculto) ======================== -->
    <div id="divAgregarEstudiante">
        <h2 class="mt-3" id="TituloAgregar">Agregar Estudiante</h2>

        <form id="formEstudiante" class="mb-4">

            <div class="mb-3 mt-3">
                <label for="codigoEstudiante">Codigo del estudiante:</label>
                <input type="text" class="form-control" id="codigoEstudiante" placeholder="Codigo del estudiante" name="codigoEstudiantePHP">
            </div>

            <div class="mb-3">
                <label for="nombresApellidos">Nombres y Apellidos:</label>
                <input type="text" class="form-control" id="nombresApellidos" placeholder="Nombres y Apellidos" name="nombresApellidosPHP">
            </div>

            <div class="mb-3">
                <label for="programa">Programa:</label>
                <input type="text" class="form-control" id="programa" placeholder="Programa" name="programaPHP">
            </div>

            <div class="mb-3">
                <label for="notaFinal">Nota final:</label>
                <input type="number" class="form-control" id="notaFinal" placeholder="Nota final" name="notaFinalPHP">
            </div>

            <div class="mb-3">
                <label for="modalidadPrograma">Modalidad:</label>
                <select class="form-select" name="modalidadProgramaPHP" id="modalidadPrograma">
                    <option value="Presencial">Presencial</option>
                    <option value="Virtual">Virtual</option>
                </select>
            </div>

            <button type="button" class="btn btn-primary mb-3" id="botonAgregar" onclick="AgregarEstudiante(); OcultarFormulario();">Guardar Estudiante</button>
            <button type="button" class="btn btn-warning mb-3" onclick="OcultarFormulario();">Cancelar</button>

        </form> 
    </div> 

    <hr>

    <!-- ======================== TABLA ======================== -->
    <h5 class="mb-3">Lista de Estudiantes</h5>

    <table class="table table-hover" id="tablaEstudiantes">
        <thead>
            <tr>
                <th>Codigo del Estudiante</th>
                <th>Nombres y Apellidos</th>
                <th>Programa</th>
                <th>Nota Final</th>
                <th>Modalidad</th>
                <th>Definitiva</th>
                <th>Modificar</th>
                <th>Eliminar</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <h3 class="mt-4">Promedio del grupo: <span id="promedioGrupo">0</span></h3>
</div> 

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="model/Estudiante.js"></script>
<script src="model/Virtual.js"></script>
<script src="model/Presencial.js"></script>
<script src="controller/EstudianteController.js"></script>
<script src="controller/MainController.js"></script>
</body>
</html>
